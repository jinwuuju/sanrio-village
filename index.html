ymin=minB+dy+10;fork=[120,clamp(maxB+dy+42,282,320)];trunk=curve(120,360,fork[0],fork[1],120,(360+fork[1])/2);
spots=ord.map((j,i)=>{const s=Object.assign({},opts[j],{x:ps[i][0],y:ps[i][1]+dy,rv:0});s.pts=curve(fork[0],fork[1],s.x,s.y+16,s.x,fork[1]-18);s.cn=[.4,.72].map(t=>{const p=s.pts[Math.round(t*(s.pts.length-1))];return{x:p[0],y:p[1],got:0}});return s});return n}
function showQ(){setM('q');stg=stageOf(cur);reset();pa=0;spawn();irisT=0;hud();const x=Q[cur],a=ans[cur];say(x.q,x.g);build();const sg=$('signs');sg.innerHTML=spots.map((s,i)=>`<div class="sg pe${a===s.v?' pk':''}" style="left:${s.x/CW*100}%;top:${(s.y-54)/CH*100}%;animation-delay:${i*.07}s" onclick="walkTo(${i})"><div class="ic"><i class="ti ti-${s.ic}" aria-hidden="true"></i><b>${i+1}</b></div><div class="tx">${s.sh}</div></div>`).join('');updNear()}
function updNear(){[...$('signs').children].forEach((c,i)=>c.classList.toggle('on',i===near));okRdy(near>=0);const sh=$('sheet');if(near>=0&&spots[near]){const s=spots[near];sh.innerHTML=`<b><i class="ti ti-${s.ic}" aria-hidden="true"></i> ${s.sh}</b><br>${s.t}<em>확인을 누르면 이 길로 결정</em>`;sh.className='on'}else sh.className=''}

function act(){if(mode==='q'){if(busy)return;if(near>=0)choose(near);else toast('길 끝 빛나는 자리에 서서 눌러요')}else if(mode==='stage')enter();else if(mode==='title')startGame();else if(mode==='clear')nextStage()}

function starsOf(s){const nq=stEnd(s)-STG[s][0],r=stC[s]/(nq*4);return r>=.7?3:r>=.45?2:1}
function compute(A){const sum=[0,0,0,0,0],cnt=[0,0,0,0,0],tags=[];Q.forEach((x,i)=>{const a=A[i];if(a==null)return;const o=x.o[a];sum[x.k]+=o[3];cnt[x.k]++;if(o[5])tags.push(o[5])});const u=sum.map((s,k)=>cnt[k]?s/cnt[k]:3);const sc=C.map(c=>{let d=0;for(let k=0;k<5;k++)d+=(u[k]-c.s[k])**2;const m=c.t.filter(t=>tags.includes(t));return{c,raw:d-0.8*m.length,m}}).sort((a,b)=>a.raw-b.raw);const tgt=[6-u[0],u[1],6-u[2],u[3],6-u[4]],top=sc[0].c;const chem=C.filter(x=>x!==top).map(x=>({x,d:x.s.reduce((a,v,k)=>a+(v-tgt[k])**2,0)})).sort((a,b)=>a.d-b.d)[0].x;return{u,tags,sc,chem}}

function showClear(s){clr();reset();setM('clear');cleared.add(s);stg=s;hud();const st=starsOf(s),R=compute(ans),c=R.sc[0].c;irisT=0;confetti('#ED6A9A');

cap('<span style="color:#ED6A9A">몽글이</span> · 30일 동안 정말 수고했어! 축제 무대 한가운데로 와 줘.');
T(2600,()=>{onHead=true;PL.j=12;cap('<span style="color:#ED6A9A">몽글이</span> · 음… 너랑 제일 닮은 친구가 누군지 알 것 같아. 두구두구…')});

ov(`<div class="card" style="border:4px solid ${c.c[1]}"><div class="kick">나와 닮은 단짝</div><div style="margin:10px 0 4px">${avHTML(c,96)}</div><div class="h1" style="margin:6px 0">${c.n}!</div><p class="dsc">${c.k}<br>싱크로율 ${s1}%</p><button class="gbtn pe" onclick="$('res').scrollIntoView({behavior:'smooth'})">결과 카드 열기</button></div>`);hydrate()})})}
function results(R){const c=R.sc[0].c,s1=sim(R.sc[0].raw),u=R.u,ch=R.chem,mins=Math.max(1,Math.round((Date.now()-startT)/60000)),starN=[0,1,2,3,4].reduce((a,s)=>a+starsOf(s),0);
const ord=[0,1,2,3,4].sort((a,b)=>Math.abs(u[a]-c.s[a])-Math.abs(u[b]-c.s[b])),ph=k=>PH[k][c.s[k]>=4?0:c.s[k]<=2?2:1];

const CARDS=[['heart','#ED6A9A','닮은 점',`${AXN[ord[0]]}과 ${AXN[ord[1]]}`,`<p>${ph(ord[0])}, 그리고 ${ph(ord[1])}이 꼭 닮았어요.</p>${R.sc[0].m.length?`<p>취향까지 통해요: ${R.sc[0].m.map(t=>TN[t]).join(', ')}.</p>`:''}`],

['sparkles','#E09A00','나의 강점',strong,`<p>30일 동안 ${AXN[sk]} 점수가 가장 뚜렷하게 나타났어요.</p>`],
